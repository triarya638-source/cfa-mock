<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFA Mock Exams</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#30363d; --text:#e6edf3; --muted:#8b949e;
  --accent:#58a6ff; --good:#3fb950; --bad:#f85149; --warn:#d29922;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f6f8fa; --panel:#ffffff; --panel2:#eef2f6; --line:#d0d7de; --text:#1f2328; --muted:#59636e;
         --accent:#0969da; --good:#1a7f37; --bad:#cf222e; --warn:#9a6700; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:28px;margin:8px 0 4px}
h2{font-size:20px;margin:32px 0 12px}
.sub{color:var(--muted);margin:0 0 8px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h3{margin:0 0 2px;font-size:18px}
.sess{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:12px 0 0;margin-top:12px}
.sess .meta{font-size:14px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:middle}
.pill.ok{color:var(--good);border-color:var(--good)} .pill.no{color:var(--warn);border-color:var(--warn)}
.note{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:12px 14px;color:var(--muted);font-size:14px}
/* quiz */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top .title{font-weight:600;flex:1;min-width:160px}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.timer.low{color:var(--bad)}
.layout{display:grid;grid-template-columns:1fr 250px;gap:20px;margin-top:18px}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.qhead{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:14px;margin-bottom:10px}
.qtext{white-space:pre-line;font-size:17px;margin:0 0 12px}
.qimg{max-width:100%;display:block;margin:8px 0 14px;border:1px solid var(--line);border-radius:8px;background:#fff}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.opt:hover{border-color:var(--accent)}
.opt .l{font-weight:700;min-width:1.2em}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel2))}
.explain{white-space:pre-line;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:15px}
.explain .t{color:var(--muted);font-size:13px;margin-bottom:6px;white-space:normal}
.nav{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.nav .sp{flex:1}
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;align-self:start;position:sticky;top:64px}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pal button{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-size:13px;padding:0;position:relative}
.pal button.ans{background:color-mix(in srgb,var(--accent) 30%,var(--panel2));border-color:var(--accent)}
.pal button.cur{outline:2px solid var(--text)}
.pal button.fl::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.pal button.ok{background:color-mix(in srgb,var(--good) 35%,var(--panel2));border-color:var(--good)}
.pal button.bad{background:color-mix(in srgb,var(--bad) 35%,var(--panel2));border-color:var(--bad)}
.legend{font-size:12px;color:var(--muted);margin-top:10px}
.score{font-size:44px;font-weight:700;margin:4px 0}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel2);border:0;padding:6px 12px}
.seg button.on{background:var(--accent);color:#fff}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ---------- Registry: add a new mock/session here and drop a data/<id>.js file ---------- */
const MOCKS_META = [
  { mock: 1, title: "Mock 1", sets: [ {id:"m1s1", session:1}, {id:"m1s2", session:2} ] },
  { mock: 2, title: "Mock 2", sets: [ {id:"m2s1", session:1}, {id:"m2s2", session:2} ] },
  { mock: 3, title: "Mock 3", sets: [ {id:"m3s1", session:1}, {id:"m3s2", session:2} ] }
];
const EXAM_MINUTES = 135;           // 90 questions / 135 min per session
window.MOCKS = window.MOCKS || {};

const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L = ['A','B','C'];

/* ---------- storage (safe) ---------- */
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem('cfamock:'+k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('cfamock:'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('cfamock:'+k); }catch(e){} }
};

function loadSet(id){
  if(window.MOCKS[id]) return Promise.resolve(window.MOCKS[id]);
  const urls = ['mock-data-'+id+'.js', 'data/'+id+'.js'];   // flat layout first, then data/ folder
  const tryUrl = i => new Promise((res,rej)=>{
    const s = document.createElement('script');
    s.src = urls[i];
    s.onload = ()=> window.MOCKS[id] ? res(window.MOCKS[id]) : rej();
    s.onerror = ()=> { s.remove(); rej(); };
    document.head.appendChild(s);
  }).catch(()=> i+1<urls.length ? tryUrl(i+1) : Promise.reject(new Error('Could not load '+urls.join(' or '))));
  return tryUrl(0);
}

/* ---------- Home ---------- */
async function home(){
  stopTimer();
  location.hash = '';
  let html = `<h1>CFA Mock Exams</h1><p class="sub">Pick a mock and a session. Mock 1, Mock 2 and Mock 3 are kept separate.</p>`;
  html += `<div class="note">Sessions marked <b>no answer key</b> can still be taken, but they can't be scored until their answers are added to the data file.</div>`;
  for(const m of MOCKS_META){
    html += `<h2>${m.title}</h2><div class="grid">`;
    for(const s of m.sets){
      const saved = store.get(s.id);
      let status = '';
      if(saved){
        const n = Object.keys(saved.answers||{}).length;
        status = saved.submitted ? 'Submitted' : (n ? `In progress · ${n}/90` : '');
      }
      html += `<div class="card" data-set="${s.id}"><h3>${m.title} · Session ${s.session}<span class="pill" id="pill-${s.id}">…</span></h3>
        <p class="sub">90 questions · ${EXAM_MINUTES} min</p>
        <div class="sess"><span class="meta">${status||'Not started'}</span>
        <span><button class="btn ghost" data-act="key" data-id="${s.id}" id="key-${s.id}">Answer key</button> ${saved?`<button class="btn ghost" data-act="reset" data-id="${s.id}">Reset</button> `:''}
        <button class="btn primary" data-act="open" data-id="${s.id}">${saved&&!saved.submitted&&Object.keys(saved.answers||{}).length?'Resume':(saved&&saved.submitted?'Review':'Start')}</button></span></div></div>`;
    }
    html += `</div>`;
  }
  $app.innerHTML = html;
  // fill key badges
  for(const m of MOCKS_META) for(const s of m.sets){
    loadSet(s.id).then(d=>{
      const el = document.getElementById('pill-'+s.id); if(!el) return;
      el.textContent = d.hasKey ? 'answer key' : 'no answer key';
      el.className = 'pill ' + (d.hasKey?'ok':'no');
      const kb = document.getElementById('key-'+s.id); if(kb && !d.hasKey){ kb.disabled = true; kb.title = 'No answer key loaded yet'; }
    }).catch(()=>{ const el=document.getElementById('pill-'+s.id); if(el){el.textContent='missing data'; el.className='pill no';} });
  }
}
$app.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const id = b.dataset.id;
  if(b.dataset.act==='open') openSet(id);
  if(b.dataset.act==='key') showKey(id);
  if(b.dataset.act==='reset'){ if(confirm('Delete saved progress for this session?')){ store.del(id); home(); } }
});

/* ---------- Answer key page ---------- */
async function showKey(id){
  stopTimer(); D=null; S=null;
  let d; try{ d = await loadSet(id); }catch(err){ return; }
  location.hash = '';
  const qs = d.questions;
  $app.innerHTML = `<button class="btn ghost" id="back">← Home</button>
  <h1>${esc(d.title)} · Answer key</h1>
  <p class="sub">Click a question number to see its explanation.</p>
  <div class="card"><div class="pal" style="grid-template-columns:repeat(auto-fill,minmax(64px,1fr))">${qs.map(q=>`<button data-k="${q.n}" style="aspect-ratio:auto;padding:8px 4px"><span style="color:var(--muted)">${q.n}</span><br><b>${L[q.correct]}</b></button>`).join('')}</div></div>
  <div id="kdetail" style="margin-top:16px"></div>
  <h2>Full list</h2>
  <div class="card"><table><tr><th>#</th><th>Answer</th><th>Topic</th></tr>${qs.map(q=>`<tr><td>${q.n}</td><td><b>${L[q.correct]}</b></td><td>${esc(q.topic||'')}</td></tr>`).join('')}</table></div>`;
  document.getElementById('back').onclick=()=>home();
  $app.querySelectorAll('[data-k]').forEach(b=> b.onclick=()=>{
    const q = qs.find(x=>x.n==b.dataset.k);
    document.getElementById('kdetail').innerHTML = `<div class="qcard"><div class="qhead"><span>Question ${q.n}</span><span>Answer: <b>${L[q.correct]}</b></span></div>
      <p class="qtext">${esc(q.q)}</p>${(q.img||[]).map(u=>`<img class="qimg" src="${esc(u)}" alt="">`).join('')}
      ${q.options.map((o,i)=>`<div class="opt ${i===q.correct?'right':''}" style="cursor:default"><span class="l">${L[i]}.</span><span>${esc(o)}</span></div>`).join('')}
      ${q.explain?`<div class="explain">${esc(q.explain)}</div>`:''}</div>`;
    document.getElementById('kdetail').scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}

/* ---------- Quiz state ---------- */
let D=null, S=null, cur=0, timerH=null, view='quiz', filter='all';

async function openSet(id){
  $app.innerHTML = '<p class="sub">Loading…</p>';
  try{ D = await loadSet(id); }catch(err){ $app.innerHTML = `<p>${esc(err.message)}</p><button class="btn" onclick="home()">Back</button>`; return; }
  S = store.get(id) || { id, mode:null, answers:{}, flags:{}, elapsed:0, submitted:false };
  location.hash = id;
  if(!S.mode){ chooseMode(); return; }
  cur = S.cur||0;
  view = S.submitted ? 'result' : 'quiz';
  render(); startTimer();
}
function save(){ S.cur = cur; store.set(D.id, S); }

function chooseMode(){
  $app.innerHTML = `<button class="btn ghost" onclick="home()">← Back</button>
  <h1>${esc(D.title)}</h1>
  <p class="sub">${D.questions.length} questions${D.hasKey?'':' · <b>no answer key loaded</b>'}</p>
  <div class="grid">
    <div class="card"><h3>Exam mode</h3><p class="sub">${EXAM_MINUTES}-minute countdown. No feedback until you submit.</p>
      <button class="btn primary" data-m="exam">Start exam</button></div>
    <div class="card"><h3>Practice mode</h3><p class="sub">No time limit. ${D.hasKey?'See the answer and explanation right after each question.':'Answer key not loaded, so no instant feedback for this session.'}</p>
      <button class="btn" data-m="practice">Start practice</button></div>
  </div>`;
  $app.querySelectorAll('[data-m]').forEach(b=> b.onclick = ()=>{ S.mode=b.dataset.m; cur=0; save(); view='quiz'; render(); startTimer(); });
}

function startTimer(){
  stopTimer();
  if(S.submitted) return;
  timerH = setInterval(()=>{
    S.elapsed++;
    if(S.elapsed%10===0) save();
    const t = document.getElementById('timer'); if(t) t.outerHTML = timerHTML();
    if(S.mode==='exam' && S.elapsed >= EXAM_MINUTES*60){ submit(true); }
  },1000);
}
function stopTimer(){ if(timerH){ clearInterval(timerH); timerH=null; } }
function fmt(sec){ sec=Math.max(0,sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0'); }
function timerHTML(){
  if(S.mode==='exam'){ const left=EXAM_MINUTES*60-S.elapsed; return `<span id="timer" class="timer ${left<600?'low':''}">⏱ ${fmt(left)}</span>`; }
  return `<span id="timer" class="timer">⏱ ${fmt(S.elapsed)}</span>`;
}

/* ---------- Render quiz ---------- */
function render(){ view==='result' ? renderResult() : renderQuiz(); }

function renderQuiz(){
  const q = D.questions[cur], n = D.questions.length;
  const picked = S.answers[q.n];
  const instant = S.mode==='practice' && D.hasKey && picked!==undefined;
  let opts = q.options.map((o,i)=>{
    let cls='opt';
    if(instant){ if(i===q.correct) cls+=' right'; else if(i===picked) cls+=' wrong'; }
    else if(picked===i) cls+=' sel';
    return `<button class="${cls}" data-o="${i}"><span class="l">${L[i]}.</span><span>${esc(o)}</span></button>`;
  }).join('');
  const imgs = (q.img||[]).map(u=>`<img class="qimg" src="${esc(u)}" alt="Exhibit for question ${q.n}" loading="lazy">`).join('');
  const expl = instant && q.explain ? `<div class="explain"><div class="t">${q.topic?esc(q.topic)+' · ':''}Correct answer: <b>${L[q.correct]}</b></div>${esc(q.explain)}</div>` : '';
  $app.innerHTML = `
  <div class="top"><button class="btn ghost" id="back">← Home</button><span class="title">${esc(D.title)} <span class="pill">${S.mode}</span></span>${timerHTML()}
    <button class="btn primary" id="submit">${S.mode==='exam'?'Submit':'Finish'}</button></div>
  <div class="layout"><div>
    <div class="qcard">
      <div class="qhead"><span>Question ${q.n} of ${n}</span><button class="btn ghost" id="flag">${S.flags[q.n]?'⚑ Flagged':'⚐ Flag'}</button></div>
      <p class="qtext">${esc(q.q)}</p>${imgs}${opts}${expl}
      <div class="nav"><button class="btn" id="prev" ${cur===0?'disabled':''}>← Prev</button>
        <span class="sp"></span><button class="btn" id="clear" ${picked===undefined?'disabled':''}>Clear</button>
        <button class="btn primary" id="next" ${cur===n-1?'disabled':''}>Next →</button></div>
    </div></div>
    <aside class="side"><div class="pal">${D.questions.map((x,i)=>{
      let c=''; if(S.answers[x.n]!==undefined) c+=' ans'; if(i===cur) c+=' cur'; if(S.flags[x.n]) c+=' fl';
      return `<button class="${c}" data-g="${i}">${x.n}</button>`; }).join('')}</div>
      <div class="legend">${Object.keys(S.answers).length}/${n} answered · ${Object.keys(S.flags).filter(k=>S.flags[k]).length} flagged</div>
    </aside></div>`;
  $app.querySelectorAll('[data-o]').forEach(b=> b.onclick=()=>{ if(instant) return; S.answers[q.n]=+b.dataset.o; save(); renderQuiz(); });
  $app.querySelectorAll('[data-g]').forEach(b=> b.onclick=()=>{ cur=+b.dataset.g; save(); renderQuiz(); window.scrollTo(0,0); });
  document.getElementById('prev').onclick=()=>{ cur--; save(); renderQuiz(); window.scrollTo(0,0); };
  document.getElementById('next').onclick=()=>{ cur++; save(); renderQuiz(); window.scrollTo(0,0); };
  document.getElementById('clear').onclick=()=>{ delete S.answers[q.n]; save(); renderQuiz(); };
  document.getElementById('flag').onclick=()=>{ S.flags[q.n]=!S.flags[q.n]; save(); renderQuiz(); };
  document.getElementById('back').onclick=()=>{ save(); home(); };
  document.getElementById('submit').onclick=()=>submit(false);
}

function submit(auto){
  const un = D.questions.length - Object.keys(S.answers).length;
  if(!auto && !confirm(un? `${un} question(s) unanswered. Submit anyway?` : 'Submit this session?')) return;
  S.submitted = true; save(); stopTimer(); view='result'; filter='all'; renderResult(); window.scrollTo(0,0);
}

/* ---------- Results ---------- */
function renderResult(){
  const qs = D.questions, n = qs.length;
  const answered = Object.keys(S.answers).length;
  let right=0; const byTopic={};
  qs.forEach(q=>{
    const ok = D.hasKey && S.answers[q.n]===q.correct; if(ok) right++;
    if(D.hasKey){ const t=q.topic||'Other'; (byTopic[t]=byTopic[t]||{r:0,t:0}).t++; if(ok) byTopic[t].r++; }
  });
  const pct = Math.round(right/n*100);
  const rows = Object.entries(byTopic).sort((a,b)=>a[1].r/a[1].t-b[1].r/b[1].t);
  const list = qs.filter(q=>{
    const a=S.answers[q.n], ok=D.hasKey&&a===q.correct;
    if(filter==='wrong') return D.hasKey && !ok;
    if(filter==='flag') return S.flags[q.n];
    return true;
  });
  $app.innerHTML = `<div class="top"><button class="btn ghost" id="back">← Home</button><span class="title">${esc(D.title)} · Results</span>
    <button class="btn" id="retake">Retake</button></div>
  <div class="card" style="margin-top:18px">
    ${D.hasKey ? `<div class="score">${right} / ${n} <span class="sub" style="font-size:20px">(${pct}%)</span></div><div class="bar"><i style="width:${pct}%"></i></div>`
      : `<div class="score">${answered} / ${n} answered</div><p class="sub">No answer key is loaded for this session, so it can't be scored.</p>`}
    <p class="sub">Time used: ${fmt(S.elapsed)} · Mode: ${S.mode}</p>
  </div>
  ${rows.length>1?`<h2>By topic (weakest first)</h2><div class="card"><table><tr><th>Topic</th><th>Score</th></tr>${rows.map(([t,v])=>`<tr><td>${esc(t)}</td><td>${v.r}/${v.t}</td></tr>`).join('')}</table></div>`:''}
  <h2>Review</h2>
  <div class="seg" id="seg"><button data-f="all" class="${filter==='all'?'on':''}">All</button>
    <button data-f="wrong" class="${filter==='wrong'?'on':''}" ${D.hasKey?'':'disabled'}>Incorrect</button>
    <button data-f="flag" class="${filter==='flag'?'on':''}">Flagged</button></div>
  <div style="margin-top:14px">${list.map(q=>{
      const a=S.answers[q.n];
      const opts=q.options.map((o,i)=>{
        let c='opt'; if(D.hasKey){ if(i===q.correct) c+=' right'; else if(i===a) c+=' wrong'; } else if(i===a) c+=' sel';
        return `<div class="${c}" style="cursor:default"><span class="l">${L[i]}.</span><span>${esc(o)}</span></div>`; }).join('');
      const imgs=(q.img||[]).map(u=>`<img class="qimg" src="${esc(u)}" alt="" loading="lazy">`).join('');
      return `<div class="qcard" style="margin-bottom:14px"><div class="qhead"><span>Question ${q.n}${S.flags[q.n]?' · ⚑':''}</span>
        <span>${a===undefined?'Unanswered':(D.hasKey?(a===q.correct?'✔ Correct':'✘ Incorrect'):'Answered '+L[a])}</span></div>
        <p class="qtext">${esc(q.q)}</p>${imgs}${opts}
        ${D.hasKey&&q.explain?`<div class="explain"><div class="t">${q.topic?esc(q.topic)+' · ':''}Correct answer: <b>${L[q.correct]}</b></div>${esc(q.explain)}</div>`:''}</div>`; }).join('')||'<p class="sub">Nothing to show.</p>'}</div>`;
  document.getElementById('back').onclick=()=>home();
  document.getElementById('retake').onclick=()=>{ if(confirm('Clear your answers and start over?')){ store.del(D.id); openSet(D.id); } };
  document.querySelectorAll('#seg [data-f]').forEach(b=> b.onclick=()=>{ filter=b.dataset.f; renderResult(); });
}

/* ---------- Keyboard ---------- */
document.addEventListener('keydown', e=>{
  if(!D || !S || view!=='quiz' || S.submitted || e.target.tagName==='INPUT') return;
  const q = D.questions[cur];
  const k = e.key.toUpperCase();
  if(['A','B','C'].includes(k)){ const instant=S.mode==='practice'&&D.hasKey&&S.answers[q.n]!==undefined; if(!instant){ S.answers[q.n]=L.indexOf(k); save(); renderQuiz(); } }
  else if(e.key==='ArrowRight' && cur<D.questions.length-1){ cur++; save(); renderQuiz(); }
  else if(e.key==='ArrowLeft' && cur>0){ cur--; save(); renderQuiz(); }
  else if(k==='F'){ S.flags[q.n]=!S.flags[q.n]; save(); renderQuiz(); }
});

/* ---------- Boot ---------- */
const startId = location.hash.slice(1);
if(startId && MOCKS_META.some(m=>m.sets.some(s=>s.id===startId))) openSet(startId); else home();
</script>
